<title id="t">The leakguard menu in the GNOME top bar on Linux</title>
<desc id="d">The green shield in the GNOME top bar opens the leakguard menu: Protected; VPN connected for 2 h 15 min; Today: 14 blocks · VPN dropped 2 times. Protect these services: Anthropic (Claude) ticked, OpenAI (ChatGPT, Codex) coming soon. Then Change VPN…, Pause protection, Open at login (ticked), Uninstall leakguard… and Quit.</desc>
