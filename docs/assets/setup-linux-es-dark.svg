<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" role="img" aria-labelledby="t d" font-family="Cantarell, Ubuntu, 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">La configuración de leakguard en 3 pasos en Linux</title>
<desc id="d">Tres ventanas de GNOME aparecen una tras otra. Paso 1 de 3: elige qué quieres proteger; Anthropic (Claude) queda marcado en la lista y OpenAI (ChatGPT, Codex) llega próximamente. Paso 2 de 3: desconecta tu VPN y toca Siguiente, conéctala y toca Siguiente, y leakguard dice: ¡Encontramos tu VPN! La que conectaste aparece como: WireGuard. Paso 3 de 3: activa la protección; tu computadora te pide tu contraseña de administrador una sola vez.</desc>
<style>
.k1,.k2,.k3{animation:k1 12s infinite}
.k2{animation-name:k2}.k3{animation-name:k3}
.ck{animation:ck 12s steps(1) infinite}
.sa{opacity:0;animation:sa 12s steps(1) infinite}
.sb{opacity:0;animation:sb 12s steps(1) infinite}
.sc{animation:sc 12s steps(1) infinite}
@keyframes k1{0%{opacity:0;transform:translateY(8px)}5%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes k2{0%,22%{opacity:0;transform:translateY(8px)}27%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes k3{0%,60%{opacity:0;transform:translateY(8px)}65%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes ck{0%{opacity:0}13%,100%{opacity:1}}
@keyframes sa{0%{opacity:1}35%,100%{opacity:0}}
@keyframes sb{0%{opacity:0}35%{opacity:1}47%,100%{opacity:0}}
@keyframes sc{0%{opacity:0}47%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".18"/></filter></defs>
<g class="k1">
<rect x="10" y="16" width="270" height="282" rx="12" fill="#242424" stroke="#3d3d3d" filter="url(#sh)"/>
<path d="M10 28a12 12 0 0 1 12-12h246a12 12 0 0 1 12 12v28h-270z" fill="#303030"/>
<line x1="10" y1="56.5" x2="280" y2="56.5" stroke="#1c1c1c"/>
<text x="145" y="41" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">Paso 1 de 3</text>
<circle cx="258" cy="36" r="10" fill="#464646"/>
<path d="M254.5 32.5l7 7m0-7l-7 7" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
<rect x="26" y="198" width="238" height="36" rx="8" fill="#333333" stroke="#454545"/>
<rect x="38" y="208" width="16" height="16" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<g class="ck"><rect x="38" y="208" width="16" height="16" rx="4" fill="#3584e4"/><path d="M42 216l3 3 5.5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="64" y="220.5" font-size="12" fill="#e8e8e8">Anthropic (Claude)</text>
<text x="28" y="82" font-size="12" fill="#e8e8e8">Elige qué quieres proteger.</text>
<text x="28" y="106" font-size="12" fill="#e8e8e8">Estos servicios solo podrán usar tu</text>
<text x="28" y="122" font-size="12" fill="#e8e8e8">VPN: si tu VPN se cae, dejan de</text>
<text x="28" y="138" font-size="12" fill="#e8e8e8">conectarse hasta que vuelva.</text>
<text x="28" y="162" font-size="12" fill="#e8e8e8">Próximamente: OpenAI (ChatGPT,</text>
<text x="28" y="178" font-size="12" fill="#e8e8e8">Codex).</text>
<rect x="113" y="254" width="70" height="28" rx="6" fill="#3a3a3a"/>
<text x="148" y="272.5" font-size="12" fill="#ffffff" text-anchor="middle">Cancelar</text>
<rect x="191" y="254" width="73" height="28" rx="6" fill="#3584e4"/>
<text x="227.5" y="272.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Siguiente</text>
</g>
<g class="k2">
<rect x="305" y="16" width="270" height="282" rx="12" fill="#242424" stroke="#3d3d3d" filter="url(#sh)"/>
<path d="M305 28a12 12 0 0 1 12-12h246a12 12 0 0 1 12 12v28h-270z" fill="#303030"/>
<line x1="305" y1="56.5" x2="575" y2="56.5" stroke="#1c1c1c"/>
<text x="440" y="41" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">Paso 2 de 3</text>
<circle cx="553" cy="36" r="10" fill="#464646"/>
<path d="M549.5 32.5l7 7m0-7l-7 7" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
<g class="sa">
<text x="323" y="82" font-size="12" fill="#e8e8e8">Ahora vamos a encontrar tu VPN.</text>
<text x="323" y="106" font-size="12" fill="#e8e8e8">Desconecta tu VPN y toca Siguiente.</text>
<rect x="408" y="254" width="70" height="28" rx="6" fill="#3a3a3a"/>
<text x="443" y="272.5" font-size="12" fill="#ffffff" text-anchor="middle">Cancelar</text>
<rect x="486" y="254" width="73" height="28" rx="6" fill="#3584e4"/>
<text x="522.5" y="272.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Siguiente</text>
</g>
<g class="sb">
<text x="323" y="82" font-size="12" fill="#e8e8e8">Ahora conéctala y toca Siguiente.</text>
<rect x="408" y="254" width="70" height="28" rx="6" fill="#3a3a3a"/>
<text x="443" y="272.5" font-size="12" fill="#ffffff" text-anchor="middle">Cancelar</text>
<rect x="486" y="254" width="73" height="28" rx="6" fill="#3584e4"/>
<text x="522.5" y="272.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Siguiente</text>
</g>
<g class="sc">
<text x="323" y="82" font-size="12" fill="#e8e8e8">¡Encontramos tu VPN!</text>
<text x="323" y="106" font-size="12" fill="#e8e8e8">La que conectaste aparece como:</text>
<text x="323" y="122" font-size="12" fill="#e8e8e8">WireGuard.</text>
<text x="323" y="146" font-size="12" fill="#e8e8e8">Si no es la tuya, toca Elegir otra.</text>
<rect x="322" y="254" width="70" height="28" rx="6" fill="#3a3a3a"/>
<text x="357" y="272.5" font-size="12" fill="#ffffff" text-anchor="middle">Cancelar</text>
<rect x="400" y="254" width="78" height="28" rx="6" fill="#3a3a3a"/>
<text x="439" y="272.5" font-size="12" fill="#ffffff" text-anchor="middle">Elegir otra</text>
<rect x="486" y="254" width="73" height="28" rx="6" fill="#3584e4"/>
<text x="522.5" y="272.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Siguiente</text>
</g>
</g>
<g class="k3">
<rect x="600" y="16" width="270" height="282" rx="12" fill="#242424" stroke="#3d3d3d" filter="url(#sh)"/>
<path d="M600 28a12 12 0 0 1 12-12h246a12 12 0 0 1 12 12v28h-270z" fill="#303030"/>
<line x1="600" y1="56.5" x2="870" y2="56.5" stroke="#1c1c1c"/>
<text x="735" y="41" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">Paso 3 de 3</text>
<circle cx="848" cy="36" r="10" fill="#464646"/>
<path d="M844.5 32.5l7 7m0-7l-7 7" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
<text x="618" y="82" font-size="12" fill="#e8e8e8">Activar la protección.</text>
<text x="618" y="106" font-size="12" fill="#e8e8e8">Tu computadora te va a pedir tu</text>
<text x="618" y="122" font-size="12" fill="#e8e8e8">contraseña de administrador. La</text>
<text x="618" y="138" font-size="12" fill="#e8e8e8">necesitamos una sola vez, para</text>
<text x="618" y="154" font-size="12" fill="#e8e8e8">instalar el servicio que bloquea</text>
<text x="618" y="170" font-size="12" fill="#e8e8e8">Anthropic (Claude) si tu VPN se cae.</text>
<rect x="716" y="254" width="70" height="28" rx="6" fill="#3a3a3a"/>
<text x="751" y="272.5" font-size="12" fill="#ffffff" text-anchor="middle">Cancelar</text>
<rect x="794" y="254" width="60" height="28" rx="6" fill="#3584e4"/>
<text x="824" y="272.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Activar</text>
</g>
<path d="M283 157 l12 0 m-5 -6 l6 6 l-6 6" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M578 157 l12 0 m-5 -6 l6 6 l-6 6" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
