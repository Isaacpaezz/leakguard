<circle cx="352" cy="68" r="1.6" fill="#ffffff"/>
<rect x="350.6" y="71.5" width="2.8" height="9" rx="1.2" fill="#ffffff"/>
<g class="fa">
<text x="376" y="78" font-size="12" fill="#1a1a1a">Ahora vamos a encontrar tu VPN.</text>
<text x="376" y="110" font-size="12" fill="#1a1a1a">Desconecta tu VPN y toca</text>
<text x="376" y="126" font-size="12" fill="#1a1a1a">Siguiente.</text>
<rect x="452.75" y="252.75" width="70.5" height="22.5" rx="4" fill="#fdfdfd" stroke="#0067c0" stroke-width="1.5"/>
<text x="488" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Siguiente</text>
<rect x="532.5" y="252.5" width="71" height="23" rx="4" fill="#fdfdfd" stroke="#d0d0d0"/>
<text x="568" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Cancelar</text>
</g>
<g class="fb">
<text x="376" y="78" font-size="12" fill="#1a1a1a">Ahora conéctala y toca Siguiente.</text>
<rect x="452.75" y="252.75" width="70.5" height="22.5" rx="4" fill="#fdfdfd" stroke="#0067c0" stroke-width="1.5"/>
<text x="488" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Siguiente</text>
<rect x="532.5" y="252.5" width="71" height="23" rx="4" fill="#fdfdfd" stroke="#d0d0d0"/>
<text x="568" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Cancelar</text>
</g>
<g class="fc">
<text x="376" y="78" font-size="12" fill="#1a1a1a">¡Encontramos tu VPN!</text>
<text x="376" y="110" font-size="12" fill="#1a1a1a">La que conectaste aparece como:</text>
<text x="376" y="126" font-size="12" fill="#1a1a1a">VPN.</text>
<text x="376" y="158" font-size="12" fill="#1a1a1a">Si no es la tuya, toca Elegir</text>
<text x="376" y="174" font-size="12" fill="#1a1a1a">otra.</text>
<rect x="362.75" y="252.75" width="70.5" height="22.5" rx="4" fill="#fdfdfd" stroke="#0067c0" stroke-width="1.5"/>
<text x="398" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Siguiente</text>
<rect x="442.5" y="252.5" width="81" height="23" rx="4" fill="#fdfdfd" stroke="#d0d0d0"/>
<text x="483" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Elegir otra</text>
<rect x="532.5" y="252.5" width="71" height="23" rx="4" fill="#fdfdfd" stroke="#d0d0d0"/>
<text x="568" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Cancelar</text>
</g>
</g>
<g class="k3">
<rect x="636" y="16" width="292" height="270" rx="8" fill="#ffffff" stroke="#cfcfcf" filter="url(#sh)"/>
<path d="M636 24 a8 8 0 0 1 8 -8 h276 a8 8 0 0 1 8 8 v24 h-292 z" fill="#f3f3f3"/>
<text x="648" y="37" font-size="12" fill="#1a1a1a">Paso 3 de 3</text>
<path d="M900 27 l10 10 m0 -10 l-10 10" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/>
<path d="M636 242 h292 v36 a8 8 0 0 1 -8 8 h-276 a8 8 0 0 1 -8 -8 z" fill="#f0f0f0"/>
<line x1="636" y1="242.5" x2="928" y2="242.5" stroke="#dfdfdf"/>
<rect x="636" y="16" width="292" height="270" rx="8" fill="none" stroke="#cfcfcf"/>
<circle cx="664" cy="74" r="12" fill="#0067c0"/>
<circle cx="664" cy="68" r="1.6" fill="#ffffff"/>
<rect x="662.6" y="71.5" width="2.8" height="9" rx="1.2" fill="#ffffff"/>
<text x="688" y="78" font-size="12" fill="#1a1a1a">Activar la protección.</text>
<text x="688" y="110" font-size="12" fill="#1a1a1a">Windows te va a pedir permiso de</text>
<text x="688" y="126" font-size="12" fill="#1a1a1a">administrador. Lo necesitamos una</text>
<text x="688" y="142" font-size="12" fill="#1a1a1a">sola vez, para instalar el servicio</text>
<text x="688" y="158" font-size="12" fill="#1a1a1a">que bloquea Anthropic (Claude) si</text>
<text x="688" y="174" font-size="12" fill="#1a1a1a">tu VPN se cae.</text>
<rect x="770.75" y="252.75" width="64.5" height="22.5" rx="4" fill="#fdfdfd" stroke="#0067c0" stroke-width="1.5"/>
<text x="803" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Activar</text>
<rect x="844.5" y="252.5" width="71" height="23" rx="4" fill="#fdfdfd" stroke="#d0d0d0"/>
<text x="880" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Cancelar</text>
</g>
<path d="M308 151 l12 0 m-5 -6 l6 6 l-6 6" fill="none" stroke="#656d76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M620 151 l12 0 m-5 -6 l6 6 l-6 6" fill="none" stroke="#656d76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
