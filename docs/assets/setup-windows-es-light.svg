<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title id="t">Los 3 pasos de configuración de leakguard en Windows</title>
<desc id="d">Tres ventanas de Windows aparecen una tras otra. Paso 1 de 3 pregunta: ¿Elegir Anthropic (Claude)? con Sí, No y Cancelar, y avisa que OpenAI (ChatGPT, Codex) llega próximamente. Paso 2 de 3 encuentra tu VPN: la desconectas y tocas Siguiente, la conectas y tocas Siguiente, y leakguard dice: ¡Encontramos tu VPN! Paso 3 de 3 activa la protección: Windows pide permiso de administrador una sola vez.</desc>
<style>
.k1,.k2,.k3{animation:k1 12s infinite}
.k2{animation-name:k2}.k3{animation-name:k3}
.fa{opacity:0;animation:fa 12s steps(1) infinite}
.fb{opacity:0;animation:fb 12s steps(1) infinite}
.fc{opacity:1;animation:fc 12s steps(1) infinite}
@keyframes k1{0%{opacity:0;transform:translateY(8px)}5%,93%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes k2{0%,18%{opacity:0;transform:translateY(8px)}23%,93%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes k3{0%,64%{opacity:0;transform:translateY(8px)}69%,93%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes fa{0%{opacity:1}36%,100%{opacity:0}}
@keyframes fb{0%{opacity:0}36%{opacity:1}50%,100%{opacity:0}}
@keyframes fc{0%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".18"/></filter></defs>
<g class="k1">
<rect x="12" y="16" width="292" height="270" rx="8" fill="#ffffff" stroke="#cfcfcf" filter="url(#sh)"/>
<path d="M12 24 a8 8 0 0 1 8 -8 h276 a8 8 0 0 1 8 8 v24 h-292 z" fill="#f3f3f3"/>
<text x="24" y="37" font-size="12" fill="#1a1a1a">Paso 1 de 3</text>
<path d="M276 27 l10 10 m0 -10 l-10 10" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/>
<path d="M12 242 h292 v36 a8 8 0 0 1 -8 8 h-276 a8 8 0 0 1 -8 -8 z" fill="#f0f0f0"/>
<line x1="12" y1="242.5" x2="304" y2="242.5" stroke="#dfdfdf"/>
<rect x="12" y="16" width="292" height="270" rx="8" fill="none" stroke="#cfcfcf"/>
<circle cx="40" cy="74" r="12" fill="#0067c0"/>
<circle cx="40" cy="68" r="1.6" fill="#ffffff"/>
<rect x="38.6" y="71.5" width="2.8" height="9" rx="1.2" fill="#ffffff"/>
<text x="64" y="79" font-size="14.5" fill="#003399">¿Elegir Anthropic (Claude)?</text>
<text x="64" y="106" font-size="12" fill="#1a1a1a">Elige qué quieres proteger.</text>
<text x="64" y="138" font-size="12" fill="#1a1a1a">Estos servicios solo podrán usar tu</text>
<text x="64" y="154" font-size="12" fill="#1a1a1a">VPN: si tu VPN se cae, dejan de</text>
<text x="64" y="170" font-size="12" fill="#1a1a1a">conectarse hasta que vuelva.</text>
<text x="64" y="202" font-size="12" fill="#1a1a1a">Próximamente: OpenAI (ChatGPT,</text>
<text x="64" y="218" font-size="12" fill="#1a1a1a">Codex).</text>
<rect x="72.75" y="252.75" width="64.5" height="22.5" rx="4" fill="#fdfdfd" stroke="#0067c0" stroke-width="1.5"/>
<text x="105" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Sí</text>
<rect x="146.5" y="252.5" width="65" height="23" rx="4" fill="#fdfdfd" stroke="#d0d0d0"/>
<text x="179" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">No</text>
<rect x="220.5" y="252.5" width="71" height="23" rx="4" fill="#fdfdfd" stroke="#d0d0d0"/>
<text x="256" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Cancelar</text>
</g>
<g class="k2">
<rect x="324" y="16" width="292" height="270" rx="8" fill="#ffffff" stroke="#cfcfcf" filter="url(#sh)"/>
<path d="M324 24 a8 8 0 0 1 8 -8 h276 a8 8 0 0 1 8 8 v24 h-292 z" fill="#f3f3f3"/>
<text x="336" y="37" font-size="12" fill="#1a1a1a">Paso 2 de 3</text>
<path d="M588 27 l10 10 m0 -10 l-10 10" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/>
<path d="M324 242 h292 v36 a8 8 0 0 1 -8 8 h-276 a8 8 0 0 1 -8 -8 z" fill="#f0f0f0"/>
