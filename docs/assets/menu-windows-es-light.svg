<title id="t">El menú de leakguard en el área de notificación de Windows</title>
<desc id="d">En la barra de tareas de Windows 11, un clic en el escudo verde de leakguard del área de notificación, junto al reloj, abre su menú: Protegido; VPN conectada hace 2 h 15 min; Hoy: la VPN se cayó 2 veces. Proteger estos servicios: Anthropic (Claude) marcado, OpenAI (ChatGPT, Codex) próximamente. Luego Cambiar de VPN…, Pausar la protección, Abrir al iniciar sesión (marcado), Desinstalar leakguard… y Salir.</desc>
