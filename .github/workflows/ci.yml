name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test, vet and README check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: Linux and Windows keep compiling
        run: |
          GOOS=linux go vet ./...
          GOOS=windows go vet ./...
      - run: go test ./...
      - name: README landing page is up to date
        run: go run ./tools/readmegen -check

  test-linux-nftables:
    name: Linux nftables integration (real rules, root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install nftables and iproute2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2
      # Local traffic, and traffic forwarded through network namespaces.
      - name: Load real rules and probe them
        run: |
          go test -c -o "$RUNNER_TEMP/nft.test" ./internal/nft/
          sudo LEAKGUARD_NFT_INTEGRATION=1 "$RUNNER_TEMP/nft.test" -test.count=1 -test.run Integration -test.v

  test-windows-wfp:
    name: Windows WFP integration (real filters, elevated)
    runs-on: windows-latest
    steps:
      - name: The shell is elevated
        shell: pwsh
        run: |
          $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Write-Error "The WFP integration test needs an elevated shell"
            exit 1
          }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Unit tests
        run: go test ./internal/catalog/... ./internal/firewall/... ./internal/wfp/...
      # The tests that only Windows can run: pipe and token, probe binding,
      # real adapters, the data directory ACL, the SCM, the service handler,
      # the default route and the CLI's Windows wiring. Required: they gate
      # merges. Every package is run, then the step fails if one failed.
      - name: Windows-only tests (required)
        shell: bash
        run: |
          failed=0
          t() { go test -count=1 -v -run "$1" "$2" || failed=1; }
          t '^(TestPipe.*|TestDefaultPathIsThePipe|TestAuthorize.*Token.*)$' ./internal/ipc/
          t '^(TestBoundDial.*OnWindows)$' ./internal/probe/
          t '^(TestRealWindowsAdapters.*|TestPrepareDir.*|TestLoadRefuses.*)$' ./internal/config/
          t '^(TestSCM.*|TestWindowsDefaultPaths|TestWindowsLastLogLineReadsOnlyATrustedLog)$' ./internal/daemon/
          t '^(TestWindowsCommandLineRoundTrip|TestUserLang|TestProgramFiles|TestQuerySCM|TestCheckInstalledCLIWindows|TestDialogsWithoutManifest|TestShellExecuteInfoSize|TestRunElevatedExitCode|TestRegistryRunKey)$' ./internal/menubar/
          t '^(TestWindowsLoadsTheTrayIcons|TestWindowsPlatform)$' ./cmd/leakguard-menubar/
          t '^(TestSystemIsRootIsTheElevatedToken|TestWindowsBackends|TestWFPFirewall|TestWindowsDefaultInterface.*|TestRouteTableReadsInterfaceMetrics|TestRunAsSystemServiceOutsideTheSCM|TestSCM.*|TestRunUnderSCM.*|TestUsageOnWindows|TestOpenServiceLog)$' ./cmd/leakguard/
          exit $failed
      # Loads real filters, probes them and flushes them at the end.
      - name: Load real WFP filters and probe them
        if: ${{ !cancelled() }}
        env:
          LEAKGUARD_WFP_INTEGRATION: "1"
        run: go test -count=1 -run Integration -v ./internal/wfp/
      # The portable suite of these packages still assumes Unix in places:
      # continue-on-error until it is ported (T14).
      - name: Portable tests of the other packages
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: go test -count=1 ./internal/ipc/ ./internal/probe/ ./internal/config/ ./internal/daemon/ ./cmd/leakguard/

  package-linux:
    name: Linux packages build (not uploaded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the .deb and .tar.gz packages
        run: scripts/build-linux.sh 0.0.0-ci
      - name: The .deb installs, runs and removes cleanly
        run: |
          dpkg-deb --info dist/leakguard_0.0.0-ci_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ./dist/leakguard_0.0.0-ci_amd64.deb
          leakguard version
          leakguard services
          sudo apt-get remove -y -qq leakguard

  test-macos:
    name: Test on macOS (real pfctl and plutil checks)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Menu-bar app builds
        run: go build ./cmd/leakguard-menubar
      - name: CLI builds without cgo
        run: CGO_ENABLED=0 go build ./cmd/leakguard
      - name: App bundle and DMG build (not uploaded)
        run: scripts/build-macos.sh 0.0.0-ci
