name: Release

# Builds the macOS DMG, the Linux packages and the Windows installers and
# publishes them on GitHub Releases. Only the maintainer pushes v* tags;
# agents never do (AGENTS.md rule 10). Every build runs without write
# access and keeps its files as a workflow artifact; the publish job, the
# only one that may write, creates the release with all of them once every
# build succeeded, so a release never appears with a platform missing.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Release notes from CHANGELOG.md
        run: go run ./tools/releasenotes -version "${TAG#v}" > "$RUNNER_TEMP/notes.md"
      - name: Build leakguard.app and the DMG
        run: scripts/build-macos.sh "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/leakguard-*-macos.dmg
            dist/leakguard-*-macos.dmg.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build the .deb and .tar.gz packages
        run: scripts/build-linux.sh "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Windows keeps compiling
        run: GOOS=windows go vet ./...
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build the amd64 and arm64 installers
        run: scripts/build-windows.sh "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the GitHub Release with every package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          prerelease=()
          # Versions below 1.0 and pre-releases (1.2.3-rc.1) are marked as pre-releases.
          case "$version" in
            0.*|*-*) prerelease=(--prerelease) ;;
          esac
          assets=(
            "artifacts/macos-packages/leakguard-$version-macos.dmg"
            "artifacts/macos-packages/leakguard-$version-macos.dmg.sha256"
            artifacts/linux-packages/*
            artifacts/windows-packages/*
          )
          # A re-run after a failed upload completes the existing release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "leakguard $version" \
              --notes-file artifacts/release-notes/notes.md \
              "${prerelease[@]}" \
              "${assets[@]}"
          fi
