name: Bug report
description: Something does not work as described.
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. You can write in English or Spanish.
        Remove real IP addresses, VPN server names and other private data before submitting.
        If traffic reached a protected service outside the VPN, report it privately instead (see SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the VPN
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: macOS 26.1, Ubuntu 24.04, Windows 11 24H2...
  - type: input
    id: vpn
    attributes:
      label: VPN client and interface name
      placeholder: VPN Bypass + IPsec (ipsec0), WireGuard (utun4)...
  - type: input
    id: version
    attributes:
      label: leakguard version or commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: For example `sudo pfctl -a com.apple/250.AnthropicKillSwitch -s rules`. Remove private data.
      render: shell
